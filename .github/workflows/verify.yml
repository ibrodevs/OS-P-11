name: Verify OS-P-11
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments.py
      - run: make -C c
      - run: ./c/page_faults --mode anon --pattern sequential --mb 4 --passes 2
      - run: ./c/matrix_bench --size 512 --repeats 1
